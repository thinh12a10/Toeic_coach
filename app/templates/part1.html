<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TOEIC Speaking Part 1</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <h1>TOEIC Speaking Part 1 - Read Aloud</h1>

    <div class="container">

        <div class="left-panel">

            <h2>Question</h2>

            <div id="loading-indicator" class="loading-indicator" style="display: none;">
                <span class="spinner"></span>
                <span class="loading-text">Loading question...</span>
            </div>

            <div id="question-text">
                Click "Next Question"
            </div>

        </div>

        <div class="right-panel">

            <h2>Evaluation Result</h2>

            <div id="loading-evaluation-indicator" class="loading-indicator" style="display: none;">
                <span class="spinner"></span>
                <span class="loading-text">Evaluating...</span>
            </div>

            <div id="evaluation-result">
                Waiting for evaluation...
            </div>

        </div>

    </div>

    <div class="controls">

        <button id="next-btn">
            Next Question
        </button>

        <button id="start-btn">
            🎤 Start Recording
        </button>

        <button id="stop-btn">
            ⏹ Stop Recording
        </button>

        <button id="reset-btn">
            Reset
        </button>

    </div>

    <script src="/static/part1.js"></script>

</body>

</html>
